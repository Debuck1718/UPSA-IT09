<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Course Slides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/style.css">
    <link rel="stylesheet" href="/public/dashboard-nav.css">
    <link rel="stylesheet" href="/public/dashboard-ultra.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  </head>
  <body>
    <div class="d-flex">
      <nav class="sidebar d-flex flex-column align-items-center justify-content-between shadow-lg">
        <div class="w-100 text-center mb-4">
          <img id="avatar" class="avatar" alt="avatar">
          <h4 class="mt-2 mb-0">Hi, <span id="user-name" style="color:#22d3ee"></span></h4>
          <span id="user-role" class="badge bg-light text-dark text-uppercase"></span>
          <div class="mt-1 text-info fw-bold">Course: <span id="user-course" style="color:#fff"></span></div>
        </div>
        <ul class="nav flex-column w-100 px-3">
          <li class="nav-item" id="admin-link" style="display:none"><a class="nav-link" href="/public/admin.html"><i class="bi bi-shield-lock me-2"></i> Admin Panel</a></li>
          <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-door me-2"></i> Dashboard</a></li>
          <li class="nav-item upload-link" style="display:none"><a class="nav-link" href="#upload"><i class="bi bi-upload me-2"></i> Upload Slide</a></li>
          <li class="nav-item"><a class="nav-link" href="#slides"><i class="bi bi-folder2-open me-2"></i> My Course Slides</a></li>
          <li class="nav-item mt-5"><a class="nav-link" id="logoutBtn" href="#"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
        </ul>
        <div class="text-center mt-5"><small>&copy; 2026 UPSA-IT09</small></div>
      </nav>

      <div class="main-content w-100 py-5 px-4">
        <div class="mb-4 d-flex flex-wrap gap-3 justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <span class="fs-2 fw-bold text-white">Course Slides Portal</span>
            <span class="badge bg-gradient text-dark fs-6" style="background:linear-gradient(90deg,#6366f1,#06b6d4);color:#fff;">Ultra Modern</span>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-info" onclick="document.getElementById('slides').scrollIntoView()">View Slides</button>
            <button class="btn btn-outline-primary upload-link" style="display:none" onclick="document.getElementById('upload').scrollIntoView()">Upload Slide</button>
          </div>
        </div>

        <div id="upload" class="card mb-4 border-0 shadow-sm" style="display:none">
          <div class="card-header">Upload Course Slide</div>
          <div class="card-body">
            <form id="uploadForm" enctype="multipart/form-data" class="d-flex flex-column flex-md-row align-items-center gap-3">
              <input class="form-control flex-fill" type="file" name="file" required>
              <button class="upload-btn" type="submit">Upload</button>
            </form>
          </div>
        </div>

        <div id="slides" class="card border-0 shadow-sm">
          <div class="card-header"><i class="bi bi-folder2-open me-2" style="color:#fff;font-size:1.5rem;"></i> My Course Slides</div>
          <ul id="slidesList" class="list-group list-group-flush slide-list px-3 py-2"></ul>
        </div>
      </div>
    </div>

    <script src="/public/dashboard.js"></script>
  </body>
</html>
