<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Announcement • Campus Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7f6; min-height: 100vh; }
        .creation-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-label { font-size: 0.9rem; color: #444; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="mb-4">
                    <a href="announcements.html" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left"></i> Back to Announcements
                    </a>
                </div>

                <div class="card creation-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h3 class="fw-bold"><i class="bi bi-megaphone me-2 text-primary"></i>New Broadcast</h3>
                            <p class="text-muted">Send an official update to students. Please ensure information is accurate.</p>
                        </div>

                        <form id="announcementForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Headline</label>
                                <input type="text" name="title" class="form-control" placeholder="e.g. End of Semester Timetable Update" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Announcement Content</label>
                                <textarea name="content" class="form-control" rows="6" placeholder="Write your message here..." required></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Target Audience</label>
                                    <select name="target_program" class="form-select" id="programSelect">
                                        <option value="">All Students in My Institution</option>
                                        </select>
                                </div>
                                
                                <div class="col-md-6 mb-3 d-flex align-items-end">
                                    <div id="globalToggleArea" class="d-none">
                                        <div class="form-check form-switch mb-2">
                                            <input class="form-check-input" type="checkbox" name="is_global" id="isGlobalAnn">
                                            <label class="form-check-label fw-bold" for="isGlobalAnn">Global Campus Broadcast</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-3 fw-bold mt-3">
                                <span id="btnText"><i class="bi bi-send-fill me-2"></i> Post Announcement</span>
                                <span id="btnLoader" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('announcementForm');
            const programSelect = document.getElementById('programSelect');
            const globalToggle = document.getElementById('globalToggleArea');

            // 1. Check Permissions & Load Programs
            try {
                const [session, programs] = await Promise.all([
                    window.api.fetch('/api/session'),
                    window.api.fetch('/api/programs') // Assuming you have a route to list programs
                ]);

                const u = session.user;
                
                // Security check: If not authorized, kick them out
                if (!(u.role === 'admin' || u.role === 'rep' || u.is_leader)) {
                    alert("Unauthorized access.");
                    window.location.href = 'announcements.html';
                    return;
                }

                // Hierarchy: Only Admins can see the Global toggle
                if (u.role === 'admin') {
                    globalToggle.classList.remove('d-none');
                }

                // Populate programs
                programSelect.innerHTML += programs.map(p => 
                    `<option value="${p.id}">${p.name}</option>`
                ).join('');

            } catch (e) {
                console.error("Initialization failed", e);
            }

            // 2. Handle Submission
            form.onsubmit = async (e) => {
                e.preventDefault();
                
                const btnText = document.getElementById('btnText');
                const btnLoader = document.getElementById('btnLoader');
                const submitBtn = document.getElementById('submitBtn');

                btnText.classList.add('d-none');
                btnLoader.classList.remove('d-none');
                submitBtn.disabled = true;

                const formData = new FormData(form);
                const payload = Object.fromEntries(formData);
                
                // Convert checkbox to boolean
                payload.is_global = form.is_global ? form.is_global.checked : false;

                try {
                    const res = await window.api.post('/api/announcements', payload);
                    if (res.ok) {
                        alert("Announcement posted!");
                        window.location.href = 'announcements.html';
                    } else {
                        alert(res.message || "Failed to post.");
                    }
                } catch (err) {
                    alert("System error. Check connection.");
                } finally {
                    btnText.classList.remove('d-none');
                    btnLoader.classList.add('d-none');
                    submitBtn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
