<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password • Acadex</title>
    <link rel="icon" type="image/png" href="./images/favicon-96x96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card p-4">
            <div class="card-body">
                <h4 class="fw-bold text-center mb-1">Set New Password</h4>
                <p class="text-muted small text-center mb-4">Please choose a strong password you haven't used before.</p>
                
                <form id="resetForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">New Password</label>
                        <input type="password" id="newPass" class="form-control" required minlength="8">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Confirm New Password</label>
                        <input type="password" id="confirmPass" class="form-control" required>
                        <div id="passError" class="text-danger small mt-1 d-none">Passwords do not match.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script>
        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const errorDiv = document.getElementById('passError');

            if (newPass !== confirmPass) {
                errorDiv.classList.remove('d-none');
                return;
            }
            errorDiv.classList.add('d-none');

            try {
                // In a Supabase flow, the access token is often in the URL fragment
                const res = await window.api.post('/api/auth/reset-password', { password: newPass });
                if (res.ok) {
                    alert("Password updated! You can now log in.");
                    window.location.href = 'index.html';
                } else {
                    alert(res.message || "Failed to reset password.");
                }
            } catch (err) {
                alert("Session expired or invalid link.");
            }
        };
    </script>
</body>
</html>
