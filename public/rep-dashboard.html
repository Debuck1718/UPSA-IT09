<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Rep • Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/public/dashboard-nav.css" />
    <link rel="stylesheet" href="/public/dashboard-ultra.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark d-lg-none p-3 shadow-sm fixed-top" style="z-index: 1060;">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fs-6">Rep Dashboard</span>
        <div class="dropdown">
          <a href="#" class="text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><a class="dropdown-item" href="/public/profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><button class="dropdown-item text-danger" id="mobileLogoutBtn"><i class="bi bi-box-arrow-left me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <aside class="sidebar d-flex flex-column p-3">
      <div class="w-100 text-center mb-4 d-none d-lg-block">
        <a href="/public/profile.html">
          <img id="repAvatar" src="/public/images/avatar.png" class="avatar mb-2" alt="Rep Profile" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%;" />
        </a>
        <h6 class="mb-0 text-white fw-bold" id="repWelcomeName">Course Rep</h6>
        <small class="text-white-50">Administrator</small>
      </div>

      <nav class="nav flex-column flex-grow-1 gap-2">
        <a class="nav-link active" href="/public/rep-dashboard.html">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a class="nav-link" href="/public/courses.html">
          <i class="bi bi-book"></i> <span>Catalog</span>
        </a>
        <a class="nav-link" href="/public/resources.html">
          <i class="bi bi-grid-1x2-fill"></i> <span>Resources</span>
        </a>
        <a class="nav-link" href="/public/announcements.html">
          <i class="bi bi-megaphone"></i> <span>Alerts</span>
        </a>
      </nav>

      <div class="mt-auto pt-4 d-none d-lg-block">
        <button id="repLogoutBtn" class="btn btn-outline-danger w-100 text-start d-flex align-items-center border-0">
          <i class="bi bi-box-arrow-left me-2"></i> <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="mb-4">
        <h2 class="text-white fw-bold">Welcome, <span id="repWelcomeName">Course Rep</span> 👋</h2>
        <p class="text-white-50">Manage class resources and slide distribution for your class group.</p>
      </header>
      </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/api.js"></script>
    <script src="/public/rep-dashboard.js"></script>
  </body>
</html>
