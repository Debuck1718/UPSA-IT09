<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Rep • Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Acadex" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/public/dashboard-nav.css" />
    <link rel="stylesheet" href="/public/dashboard-ultra.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-dark bg-dark d-lg-none p-3 shadow-sm fixed-top"
      style="z-index: 1060"
    >
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fs-6">Rep Dashboard</span>
        <div class="dropdown">
          <a
            href="#"
            class="text-white text-decoration-none dropdown-toggle"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-person-circle"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li>
              <a class="dropdown-item" href="/public/profile.html"
                ><i class="bi bi-person me-2"></i>Profile</a
              >
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item text-danger" id="mobileLogoutBtn">
                <i class="bi bi-box-arrow-left me-2"></i>Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <aside class="sidebar d-flex flex-column p-3">
      <div class="w-100 text-center mb-4 d-none d-lg-block">
        <a href="/public/profile.html">
          <img
            id="repAvatar"
            src="/public/images/avatar.png"
            class="avatar mb-2"
            alt="Rep Profile"
            style="
              width: 80px;
              height: 80px;
              object-fit: cover;
              border-radius: 50%;
            "
          />
        </a>
        <h6 class="mb-0 text-white fw-bold" id="repWelcomeName">Course Rep</h6>
        <small class="text-white-50">Administrator</small>
      </div>

      <nav class="nav flex-column flex-grow-1 gap-2">
        <a class="nav-link active" href="/public/rep-dashboard.html">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a class="nav-link" href="/public/courses.html">
          <i class="bi bi-book"></i> <span>Catalog</span>
        </a>
        <a class="nav-link" href="/public/resources.html">
          <i class="bi bi-grid-1x2-fill"></i> <span>Resources</span>
        </a>
        <a class="nav-link" href="/public/announcements.html">
          <i class="bi bi-megaphone"></i> <span>Alerts</span>
        </a>
      </nav>

      <div class="mt-auto pt-4 d-none d-lg-block">
        <button
          id="repLogoutBtn"
          class="btn btn-outline-danger w-100 text-start d-flex align-items-center border-0"
        >
          <i class="bi bi-box-arrow-left me-2"></i> <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="mb-4">
        <h2 class="text-white fw-bold">
          Welcome, <span id="repWelcomeName">Course Rep</span> 👋
        </h2>
        <p class="text-white-50">
          Manage class resources and slide distribution for your class group.
        </p>
      </header>

      <div
        id="alert"
        class="alert d-none animate__animated animate__fadeIn"
      ></div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card p-3 shadow-sm bg-white rounded-4">
            <div class="d-flex align-items-center">
              <div class="icon-box bg-primary-subtle text-primary me-3">
                <i class="bi bi-folder2-open fs-4"></i>
              </div>
              <div>
                <small class="text-muted">Courses</small>
                <h4 class="mb-0 fw-bold" id="statCourses">0</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-3 shadow-sm bg-white rounded-4">
            <div class="d-flex align-items-center">
              <div class="icon-box bg-success-subtle text-success me-3">
                <i class="bi bi-file-earmark-pdf fs-4"></i>
              </div>
              <div>
                <small class="text-muted">Total Slides</small>
                <h4 class="mb-0 fw-bold" id="statSlides">0</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card p-3 shadow-sm bg-white rounded-4">
            <div class="d-flex align-items-center">
              <div class="icon-box bg-warning-subtle text-warning me-3">
                <i class="bi bi-cloud-upload fs-4"></i>
              </div>
              <div>
                <small class="text-muted">Recent (7d)</small>
                <h4 class="mb-0 fw-bold" id="statRecent">0</h4>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4">
            <div
              class="card-header bg-primary text-white fw-bold py-3 rounded-top-4"
            >
              <i class="bi bi-plus-circle me-2"></i> Upload New Resource
            </div>
            <div class="card-body p-4">
              <form id="repDashUploadForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Course Title</label>
                  <div class="input-group">
                    <select class="form-select" id="repDashCourseTitle">
                      <option value="">Select a course title</option>
                    </select>
                    <button
                      class="btn btn-outline-primary"
                      type="button"
                      id="repDashAddTitleBtn"
                    >
                      New
                    </button>
                  </div>
                  <input
                    type="text"
                    id="repDashNewTitle"
                    class="form-control mt-2 d-none"
                    placeholder="Enter new course name"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Slide Title</label>
                  <input
                    type="text"
                    class="form-control"
                    id="repDashSlideTitle"
                    name="slideTitle"
                    placeholder="e.g. Week 1: Fundamentals"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold">File (PDF/PPTX)</label>
                  <input
                    type="file"
                    class="form-control"
                    name="file"
                    required
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-bold"
                >
                  <i class="bi bi-cloud-arrow-up me-2"></i> Upload Now
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-white mb-0">Class Catalog</h5>
            <button
              id="repDashRefreshCourses"
              class="btn btn-sm btn-outline-light rounded-pill"
            >
              <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
          </div>

          <div id="repDashCoursesSlides" class="accordion shadow-sm"></div>

          <div
            id="repDashCoursesEmpty"
            class="text-center py-5 bg-white bg-opacity-10 rounded-4 d-none"
          >
            <i class="bi bi-folder2 text-white-50 display-4"></i>
            <p class="text-white mt-3">No courses created yet.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/api.js"></script>
    <script src="/public/rep-dashboard.js"></script>
  </body>
</html>
