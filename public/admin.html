<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Command Center</title>
    <link
      rel="icon"
      type="image/png"
      href="images/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Evantrahub" />
    <link rel="manifest" href="./site.webmanifest" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --admin-dark: #0f172a;
        --admin-accent: #4361ee;
      }
      body {
        background-color: #f1f5f9;
        font-family: "Inter", system-ui, sans-serif;
      }
      .nav-tabs .nav-link {
        color: #64748b;
        font-weight: 600;
        border: none;
        padding: 1rem 1.5rem;
        transition: 0.3s;
      }
      .nav-tabs .nav-link.active {
        color: var(--admin-accent);
        border-bottom: 3px solid var(--admin-accent);
        background: none;
      }
      .card {
        border-radius: 12px;
        border: none;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      .sidebar-link {
        transition: 0.2s;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 8px;
        color: #475569;
        font-size: 0.9rem;
      }
      .sidebar-link:hover {
        background: #e2e8f0;
        color: var(--admin-dark);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./admin.html">🛡️ CAMPUS ADMIN</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <div class="text-end d-none d-md-block">
            <div class="text-white small fw-bold" id="adminHeaderName">
              Administrator
            </div>
            <span class="badge bg-success" style="font-size: 0.7rem"
              >SYSTEM SECURE</span
            >
          </div>
          <button class="btn btn-outline-danger btn-sm" id="adminLogoutBtn">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alert" class="alert d-none shadow-sm mb-4" role="alert"></div>

      <div class="row g-4">
        <div class="col-lg-3">
          <div class="card p-3 mb-4">
            <h6 class="fw-bold text-uppercase small text-muted mb-3 px-2">
              Quick Access
            </h6>
            <nav class="d-flex flex-column gap-1">
              <a href="announcements.html" class="sidebar-link"
                ><i class="bi bi-megaphone"></i> View Live Board</a
              >
              <a href="resources.html" class="sidebar-link"
                ><i class="bi bi-folder"></i> Resource Library</a
              >
              <a href="upload-resource.html" class="sidebar-link"
                ><i class="bi bi-cloud-arrow-up"></i> Global Upload</a
              >
            </nav>
          </div>
        </div>

        <div class="col-lg-9">
          <ul
            class="nav nav-tabs mb-4 bg-white rounded-3 shadow-sm px-2 overflow-x-auto flex-nowrap"
            id="adminTabs"
            role="tablist"
          >
            <li class="nav-item">
              <button
                class="nav-link active"
                data-bs-toggle="tab"
                data-bs-target="#tab-users"
              >
                Users
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#tab-announcements"
              >
                Announcements
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#tab-approvals"
              >
                Pending
                <span class="badge bg-danger ms-1 d-none" id="approvalCount"
                  >0</span
                >
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#tab-moderation"
              >
                Moderation
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#tab-resources"
              >
                Categories
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-users">
              <div class="card">
                <div class="card-header bg-white py-3">
                  <div class="row g-2 align-items-center">
                    <div class="col-md-7">
                      <input
                        type="search"
                        id="userSearch"
                        class="form-control"
                        placeholder="Search name, ID, or class..."
                      />
                    </div>
                    <div class="col-md-5 text-md-end">
                      <button
                        class="btn btn-dark w-100"
                        onclick="document.getElementById('csvfile').click()"
                      >
                        <i class="bi bi-upload me-2"></i>Bulk Import
                      </button>
                      <input
                        type="file"
                        id="csvfile"
                        class="d-none"
                        accept=".csv"
                      />
                    </div>
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th class="ps-4">Student</th>
                        <th>Class</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Action</th>
                      </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="tab-announcements">
              <div class="row g-4">
                <div class="col-lg-5">
                  <div
                    class="card p-4 shadow-sm border-0 sticky-lg-top"
                    style="top: 80px"
                  >
                    <h6 class="fw-bold mb-3">
                      <i class="bi bi-pencil-square me-2"></i>Create Broadcast
                    </h6>
                    <form id="announcementForm">
                      <input
                        type="text"
                        id="annTitle"
                        class="form-control mb-3"
                        placeholder="Announcement Title"
                        required
                      />
                      <textarea
                        id="annContent"
                        class="form-control mb-3"
                        rows="5"
                        placeholder="Write your message here..."
                        required
                      ></textarea>
                      <select id="annTarget" class="form-select mb-3">
                        <option value="global">Public (Global)</option>
                        <option value="institution">
                          Private (Institution)
                        </option>
                      </select>
                      <button
                        type="submit"
                        class="btn btn-primary w-100 fw-bold"
                      >
                        Publish Now
                      </button>
                    </form>
                  </div>
                </div>
                <div class="col-lg-7">
                  <div
                    id="announcementList"
                    class="d-flex flex-column gap-3"
                  ></div>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="tab-approvals">
              <div class="card">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th class="ps-4">Resource</th>
                        <th>Uploader</th>
                        <th class="text-end pe-4">Action</th>
                      </tr>
                    </thead>
                    <tbody id="pendingResourcesBody"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="tab-moderation">
              <div
                id="forumModerationList"
                class="list-group list-group-flush"
              ></div>
            </div>
            <div class="tab-pane fade" id="tab-resources">
              <div class="card mx-auto" style="max-width: 600px">
                <div
                  id="categoryList"
                  class="list-group list-group-flush"
                ></div>
                <div class="card-footer bg-light">
                  <div class="input-group mb-3">
                    <input
                      type="text"
                      id="newCatName"
                      class="form-control"
                      placeholder="New Category"
                    />
                    <button class="btn btn-primary" id="addCatBtn">Add</button>
                  </div>
                  <div class="border-top pt-3">
                    <p class="small text-muted mb-2">
                      <i class="bi bi-info-circle me-1"></i> Developer Tools
                    </p>
                    <button
                      class="btn btn-sm btn-outline-secondary w-100"
                      onclick="seedResources()"
                    >
                      <i class="bi bi-database-fill-up me-2"></i>Seed Default
                      Library Items
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="modalUserName">Permissions</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="editUserPermissionsForm">
              <input type="hidden" id="editStudentId" />
              <div class="mb-3">
                <label class="form-label small fw-bold text-muted"
                  >User Bio</label
                >
                <textarea id="editBio" class="form-control" rows="2"></textarea>
              </div>
              <div class="bg-light p-3 rounded border mb-3">
                <div class="form-check form-switch mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkIsRep"
                  />
                  <label class="form-check-label">Class Representative</label>
                </div>
                <div class="form-check form-switch mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkIsLeader"
                  />
                  <label class="form-check-label">Student Leader</label>
                </div>
                <div class="form-check form-switch mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkIsCreator"
                  />
                  <label class="form-check-label">Verified Creator</label>
                </div>
                <div class="form-check form-switch">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="checkIsAdmin"
                  />
                  <label class="form-check-label text-danger fw-bold"
                    >System Admin Access</label
                  >
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">
                Save Updates
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./admin.js"></script>
    <script src="./seeder.js"></script>
  
    <footer class="text-center py-3 text-muted small">Powered by Evantra De-Buckman Ventures</footer>
</body>
</html>
