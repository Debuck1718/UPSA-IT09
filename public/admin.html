<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin • Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./style.css">
    <style>
      .nav-tabs .nav-link { color: #666; font-weight: 500; border: none; }
      .nav-tabs .nav-link.active { color: var(--bs-primary); border-bottom: 3px solid var(--bs-primary); background: none; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">🛡️ SYSTEM ADMIN</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <span class="text-white-50 small d-none d-md-block" id="adminHeaderName">Admin</span>
          <button class="btn btn-outline-danger btn-sm" id="adminLogoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alert" class="alert d-none shadow-sm" role="alert"></div>

      <ul class="nav nav-tabs mb-4 border-bottom-0" id="adminTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-users">Users & Roles</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-announcements">Announcements</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-moderation">Forum Moderation</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-resources">Categories</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-users">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <div class="row g-2">
                <div class="col-md-6"><input type="search" id="userSearch" class="form-control" placeholder="Search by ID, name, or program..."></div>
                <div class="col-md-6 text-md-end">
                  <button class="btn btn-primary" onclick="document.getElementById('csvfile').click()"><i class="bi bi-upload me-2"></i>Bulk Import</button>
                  <input type="file" id="csvfile" class="d-none" accept=".csv">
                </div>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>User / Student ID</th>
                    <th>Cohort & Program</th>
                    <th>Capabilities</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="usersBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-announcements">
          <div class="row">
            <div class="col-md-4">
              <div class="card shadow-sm border-0">
                <div class="card-body">
                  <h6 class="fw-bold mb-3">Create Broadcast</h6>
                  <form id="announcementForm">
                    <input type="text" id="annTitle" class="form-control mb-2" placeholder="Title" required>
                    <textarea id="annContent" class="form-control mb-3" rows="4" placeholder="Announcement details..." required></textarea>
                    <div class="mb-3">
                      <label class="form-label small fw-bold">Target Audience</label>
                      <select id="annTarget" class="form-select form-select-sm">
                        <option value="global">Global (Everyone)</option>
                        <option value="institution">Current Institution Only</option>
                      </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Post Announcement</button>
                  </form>
                </div>
              </div>
            </div>
            <div class="col-md-8">
              <div id="announcementList" class="d-flex flex-column gap-3">
                </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-moderation">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <h6 class="mb-0 fw-bold text-danger"><i class="bi bi-shield-lock me-2"></i>Flagged Forum Posts</h6>
            </div>
            <div class="list-group list-group-flush" id="forumModerationList">
              <div class="p-5 text-center text-muted">Scanning for active threads...</div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-resources">
          <div class="card shadow-sm border-0" style="max-width: 600px;">
            <div class="card-header bg-white fw-bold">Resource Categories</div>
            <div class="list-group list-group-flush" id="categoryList"></div>
            <div class="card-footer bg-light">
              <div class="input-group">
                <input type="text" id="newCatName" class="form-control" placeholder="Add Category (e.g. Lab Manuals)">
                <button class="btn btn-primary" id="addCatBtn">Add</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalUserName">Manage User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editUserPermissionsForm">
              <input type="hidden" id="editStudentId">
              <div class="mb-3">
                <label class="form-label small fw-bold">Student Bio</label>
                <textarea id="editBio" class="form-control" rows="2"></textarea>
              </div>
              <div class="bg-light p-3 rounded border mb-3">
                <h6 class="small fw-bold mb-3 text-uppercase">Promotion & Verification</h6>
                <div class="row g-3">
                  <div class="col-6">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="checkIsRep">
                      <label class="form-check-label">Class Rep</label>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="checkIsLeader">
                      <label class="form-check-label">Leader</label>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="checkIsCreator">
                      <label class="form-check-label">Verified Creator</label>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="checkIsAdmin">
                      <label class="form-check-label text-danger fw-bold">Super Admin</label>
                    </div>
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Update Credentials</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
