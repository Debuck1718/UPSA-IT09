<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Library • Evantrahub</title>
    
    <link rel="icon" type="image/png" href="./images/favicon-96x96.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --evantrahub-blue: #0d6efd;
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: #f0f2f5;
            font-family: "Inter", sans-serif;
        }

        .navbar {
            backdrop-filter: blur(10px);
            background: rgba(33, 37, 41, 0.95) !important;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            margin-right: 10px;
            border-radius: 4px;
        }

        header {
            background: linear-gradient(135deg, #ffffff 0%, #f1f4ff 100%);
            border-bottom: 1px solid #e0e0e0;
        }

        .btn-back {
            background: white;
            border: 1px solid #dee2e6;
            color: #555;
            transition: 0.3s;
            border-radius: 12px;
        }
        .btn-back:hover {
            background: #f8f9fa;
            border-color: var(--evantrahub-blue);
            color: var(--evantrahub-blue);
            transform: translateX(-5px);
        }

        .resource-card {
            border: none;
            border-radius: 20px;
            background: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .resource-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(13, 110, 253, 0.1);
        }

        .category-pill {
            cursor: pointer;
            padding: 8px 20px !important;
            border: 1px solid #dee2e6 !important;
            background: white !important;
            color: #555 !important;
            font-weight: 500;
            transition: 0.2s;
        }
        .category-pill.active {
            background: var(--evantrahub-blue) !important;
            color: white !important;
            border-color: var(--evantrahub-blue) !important;
        }

        .youtube-thumb { position: relative; cursor: pointer; }
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: white;
            opacity: 0.8;
            transition: 0.3s;
        }
        .youtube-thumb:hover .play-overlay { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#" id="navBrand">
                <img src="./images/web-app-manifest-192x192.png" alt="Logo" class="brand-logo bg-white">
                EVANTRAHUB
            </a>
        </div>
    </nav>

    <header class="py-4 mb-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-7 d-flex align-items-center">
                    <a href="#" id="backBtn" class="btn btn-back me-3 px-3 py-2 shadow-sm">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div>
                        <h2 class="fw-bold mb-0">Resource Library</h2>
                        <p class="text-muted mb-0 small">Curated study materials and tutorials.</p>
                    </div>
                    <div id="uploadAction" class="ms-3"></div>
                </div>
                <div class="col-md-5 mt-3 mt-md-0">
                    <div class="input-group shadow-sm rounded-3 overflow-hidden">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="resourceSearch" class="form-control border-start-0 py-2" placeholder="Search by title or topic..." />
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="d-flex flex-wrap gap-2 mb-4" id="categoryFilters">
            <span class="badge rounded-pill category-pill active" data-cat="all">All Resources</span>
        </div>

        <div id="resourcesGrid" class="row g-4">
            </div>
    </div>
    <footer class="text-center py-3 text-muted small">Powered by Evantra De-Buckman Ventures</footer>

    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-0 rounded-4 overflow-hidden">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white small" id="videoTitle">Video Preview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="ratio ratio-16x9" id="videoPlayerContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./resources.js"></script>
</body>
</html>
