<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Library • Campus Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        .resource-card { transition: transform 0.2s; border: none; border-radius: 12px; overflow: hidden; }
        .resource-card:hover { transform: translateY(-5px); }
        .category-pill { cursor: pointer; transition: 0.3s; }
        .category-pill.active { background-color: var(--bs-primary) !important; color: white !important; }
        .youtube-thumb { position: relative; cursor: pointer; }
        .play-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255, 255, 255, 0.8); 
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./dashboard-modern.html"><i class="bi bi-book-half me-2"></i>CAMPUS HUB</a>
            <div class="ms-auto" id="navUserInfo"></div>
        </div>
    </nav>

    <header class="bg-white border-bottom py-4 mb-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2 class="fw-bold mb-0">Resource Library</h2>
                    <p class="text-muted">Curated study materials, past questions, and tutorials.</p>
                </div>
                <div class="col-md-6">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="resourceSearch" class="form-control border-start-0" placeholder="Search resources...">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="d-flex flex-wrap gap-2 mb-4" id="categoryFilters">
            <span class="badge rounded-pill bg-white text-dark border p-2 px-3 category-pill active" data-cat="all">All Resources</span>
            </div>

        <div class="row g-4" id="resourcesGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Scanning the archives...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="videoModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="videoTitle">Video Preview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="ratio ratio-16x9" id="videoPlayerContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./resources.js"></script>
</body>
</html>
