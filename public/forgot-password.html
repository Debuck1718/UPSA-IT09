<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password • Evantrahub</title>
    <link rel="icon" type="image/png" href="./images/favicon.ico" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <style>
      body {
        background: #f8f9fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }

      .auth-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        margin: auto;
      }

      .icon-box {
        width: 60px;
        height: 60px;
        background: #e7f0ff;
        color: #0d6efd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }

      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card auth-card p-4">
        <div class="card-body text-center">
          <div class="icon-box">
            <i class="bi bi-key-fill fs-3"></i>
          </div>

          <h4 class="fw-bold">Forgot Password?</h4>

          <p class="text-muted small mb-4">
            No worries. Enter the email address registered with your Acadex
            account and we’ll send you a secure reset link.
          </p>

          <div id="statusBox" class="alert d-none small text-start"></div>

          <form id="forgotForm">
            <div class="mb-3 text-start">
              <label for="email" class="form-label small fw-bold">
                Registered Email
              </label>

              <input
                type="email"
                id="email"
                class="form-control p-2"
                placeholder="Enter your registered email address"
                autocomplete="email"
                required
              />
            </div>

            <button
              id="submitBtn"
              type="submit"
              class="btn btn-primary w-100 py-2 fw-bold"
            >
              Send Reset Link
            </button>
          </form>

          <div class="mt-4">
            <a href="index.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left"></i> Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center py-3 text-muted small">
      Powered by Evantra De-Buckman Ventures
    </footer>

    <script src="./api.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("forgotForm");
        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submitBtn");
        const statusBox = document.getElementById("statusBox");

        const showStatus = (type, message) => {
          statusBox.className = `alert alert-${type} small text-start`;
          statusBox.textContent = message;
          statusBox.classList.remove("d-none");
        };

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = emailInput.value.trim().toLowerCase();

          if (!email) {
            showStatus("danger", "Please enter your registered email address.");
            return;
          }

          const originalText = submitBtn.innerHTML;

          try {
            submitBtn.disabled = true;
            submitBtn.innerHTML =
              '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

            const res = await window.api.post("/api/auth/forgot-password", {
              email,
            });

            if (res && res.ok) {
              showStatus(
                "success",
                "If an account exists with this email, a reset link has been sent."
              );
              form.reset();
              return;
            }

            showStatus(
              "danger",
              res?.message || "Unable to send reset link. Please try again."
            );
          } catch (err) {
            console.error("Forgot password error:", err);
            showStatus(
              "danger",
              err.message || "Connection error. Please check your internet and try again."
            );
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          }
        });
      });
    </script>
  </body>
</html>
