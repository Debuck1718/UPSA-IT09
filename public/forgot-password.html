<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password • Acadex</title>
    <link rel="icon" type="image/png" href="./images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin: auto; }
        .icon-box { width: 60px; height: 60px; background: #e7f0ff; color: #0d6efd; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card p-4">
            <div class="card-body text-center">
                <div class="icon-box">
                    <i class="bi bi-key-fill fs-3"></i>
                </div>
                <h4 class="fw-bold">Forgot Password?</h4>
                <p class="text-muted small mb-4">No worries! Enter your email you registerd with and we'll send you a reset link.</p>
                
                <form id="forgotForm">
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold">Institutional Email</label>
                        <input type="email" id="email" class="form-control p-2" placeholder="e.g. name@upsamail.edu.gh" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send Reset Link</button>
                </form>

                <div class="mt-4">
                    <a href="index.html" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script>
        document.getElementById('forgotForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            try {
                // Using Supabase Auth's reset logic
                const res = await window.api.post('/api/auth/forgot-password', { email });
                if (res.ok) {
                    alert("If an account exists for this email, a link has been sent.");
                }
            } catch (err) {
                alert("An error occurred. Please try again.");
            }
        };
    </script>
</body>
</html>
