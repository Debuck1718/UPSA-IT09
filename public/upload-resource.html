<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resource • Evantrahub</title>
    <link rel="icon" type="image/png" href="./images/web-app-manifest-192x192.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
      :root {
        --accent: #4361ee;
        --glass-bg: rgba(255, 255, 255, 0.95);
      }
      body {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      .upload-card {
        border: none;
        border-radius: 24px;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      }
      .drop-zone {
        border: 2px dashed #cbd5e0;
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: #ffffff;
        cursor: pointer;
        position: relative;
      }
      .drop-zone:hover {
        border-color: var(--accent);
        background: #f0f3ff;
      }
      .form-control, .form-select {
        border-radius: 12px;
        padding: 12px 16px;
      }
      .btn-publish {
        border-radius: 14px;
        font-weight: 700;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="container py-4 py-md-5 animate__animated animate__fadeIn">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="mb-4">
            <button onclick="goBack()" class="btn btn-link text-decoration-none text-muted p-0 small fw-medium">
              <i class="bi bi-chevron-left"></i> Back to Dashboard
            </button>
          </div>

          <div class="card upload-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-5">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-block p-4 rounded-circle mb-3">
                  <i class="bi bi-rocket-takeoff fs-1"></i>
                </div>
                <h2 class="fw-bold">Share Resource</h2>
                <p class="text-muted">Help your classmates by sharing quality study materials.</p>
              </div>

              <form id="resourceForm">
                <div class="row g-4">
                  <div class="col-12">
                    <label class="form-label fw-bold small text-uppercase text-muted">Resource Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. 2024 Audit and Assurance Slides" required />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold small text-uppercase text-muted">Category</label>
                    <select name="category_id" id="catDropdown" class="form-select" required>
                      <option value="" disabled selected>Loading...</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold small text-uppercase text-muted">Format</label>
                    <select id="sourceType" class="form-select">
                      <option value="file">📁 Document (PDF/PPT)</option>
                      <option value="youtube">🎥 YouTube Video</option>
                      <option value="link">🔗 External Link</option>
                    </select>
                  </div>

                  <div class="col-12" id="programGroup">
                    <label class="form-label fw-bold small text-uppercase text-muted">Target Program</label>
                    <select name="program_id" id="programDropdown" class="form-select" required>
                      <option value="" disabled selected>Select program...</option>
                    </select>
                    <small class="text-muted mt-1 d-block">Who should see this resource?</small>
                  </div>

                  <div class="col-12">
                    <div id="fileGroup" class="drop-zone p-5 text-center">
                      <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary mb-2"></i>
                      <h6 class="fw-bold mb-1">Click to select file</h6>
                      <p class="small text-muted mb-0">PDF, PPT, or ZIP (Max 25MB)</p>
                      <input type="file" name="file" id="fileInput" accept=".pdf,.ppt,.pptx,.zip,.doc,.docx" class="position-absolute opacity-0 w-100 h-100 top-0 start-0" style="cursor: pointer" />
                      <div id="fileNameDisplay" class="mt-3 alert alert-success d-none py-2 small fw-bold"></div>
                    </div>

                    <div id="linkGroup" class="d-none">
                      <label class="form-label fw-bold small text-uppercase text-muted" id="linkLabel">Resource URL</label>
                      <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-link-45deg"></i></span>
                        <input type="url" name="url" id="urlInput" class="form-control" placeholder="https://..." />
                      </div>
                      <small class="text-primary mt-2 d-block" id="linkHint"></small>
                    </div>
                  </div>

                  <div class="col-12 d-none" id="adminOptions">
                    <div class="p-3 bg-light border rounded-4">
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_global" id="isGlobal" />
                        <label class="form-check-label fw-bold small text-primary" for="isGlobal">MAKE GLOBAL RESOURCE</label>
                      </div>
                      <small class="text-muted d-block mt-1">Global items are visible to all students in your school.</small>
                    </div>
                  </div>

                  <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 btn-publish py-3">
                      <span id="btnText">PUBLISH RESOURCE</span>
                      <div id="btnLoader" class="spinner-border spinner-border-sm d-none"></div>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./api.js"></script>
    <script src="./upload-resource.js"></script>
  
    <footer class="text-center py-3 text-muted small">Powered by Evantra DeBuckman Ventures</footer>
</body>
</html>
