<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resource • Campus Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.9); }
        body { background: #f4f7f6; min-height: 100vh; }
        .upload-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .drop-zone { border: 2px dashed #dee2e6; border-radius: 10px; transition: 0.3s; background: #fafafa; }
        .drop-zone:hover { border-color: #0d6efd; background: #f0f7ff; }
        .btn-publish { border-radius: 10px; padding: 12px; font-weight: 600; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <a href="dashboard-modern.html" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>

                <div class="card upload-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary text-white d-inline-block p-3 rounded-circle mb-3">
                                <i class="bi bi-cloud-arrow-up fs-2"></i>
                            </div>
                            <h3 class="fw-bold">Publish Resource</h3>
                            <p class="text-muted">Share documents, links, or tutorials with the campus community.</p>
                        </div>

                        <form id="resourceForm">
                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Resource Title</label>
                                    <input type="text" name="title" class="form-control form-control-lg" placeholder="e.g. Level 300 Audit Past Questions" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Description (Optional)</label>
                                    <textarea name="description" class="form-control" rows="3" placeholder="Briefly explain what's inside..."></textarea>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Category</label>
                                    <select name="category_id" id="catDropdown" class="form-select" required>
                                        <option value="">Loading categories...</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Source Type</label>
                                    <select id="sourceType" class="form-select">
                                        <option value="file">Local File (PDF/PPT)</option>
                                        <option value="youtube">YouTube Video</option>
                                        <option value="link">Web Link/Article</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <div id="fileGroup" class="drop-zone p-5 text-center">
                                        <i class="bi bi-file-earmark-arrow-up fs-1 text-primary mb-2"></i>
                                        <p class="mb-2">Click to select or drag and drop</p>
                                        <input type="file" name="file" id="fileInput" class="form-control">
                                        <small class="text-muted">Max size: 25MB (PDF, PPT, PPTX)</small>
                                    </div>

                                    <div id="linkGroup" class="d-none">
                                        <label class="form-label fw-semibold" id="linkLabel">Resource URL</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                            <input type="url" name="url" id="urlInput" class="form-control" placeholder="https://...">
                                        </div>
                                        <small class="text-muted mt-1 d-block" id="linkHint"></small>
                                    </div>
                                </div>

                                <div class="col-12 d-none" id="adminOptions">
                                    <div class="p-3 bg-light rounded border">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" name="is_global" id="isGlobal">
                                            <label class="form-check-label fw-semibold" for="isGlobal">
                                                Mark as Global (Visible to all students)
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary w-100 btn-publish">
                                        <span id="btnText">Publish Resource</span>
                                        <span id="btnLoader" class="spinner-border spinner-border-sm d-none"></span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script src="./upload-resource.js"></script>
</body>
</html>
