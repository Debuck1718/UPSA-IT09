<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resource • Acadex</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      :root {
        --accent: #4361ee;
        --glass-bg: rgba(255, 255, 255, 0.95);
      }
      body {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        min-height: 100vh;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .upload-card {
        border: none;
        border-radius: 24px;
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      }

      .drop-zone {
        border: 2px dashed #cbd5e0;
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: #ffffff;
        cursor: pointer;
        position: relative;
      }
      .drop-zone:hover {
        border-color: var(--accent);
        background: #f0f3ff;
        transform: scale(1.01);
      }

      .form-control,
      .form-select {
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid #e2e8f0;
        transition: 0.2s;
      }
      .form-control:focus {
        box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        border-color: var(--accent);
      }

      .btn-publish {
        border-radius: 14px;
        padding: 14px;
        font-weight: 700;
        background: var(--accent);
        border: none;
        transition: 0.3s;
      }
      .btn-publish:hover {
        background: #3751d4;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
      }

      /* Mobile specific spacing */
      @media (max-width: 768px) {
        .upload-card {
          border-radius: 0;
          box-shadow: none;
          background: transparent;
        }
        .container {
          padding: 0;
        }
        .card-body {
          padding: 1.5rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-4 py-md-5 animate__animated animate__fadeIn">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="mb-4 px-3 px-md-0">
            <button
              onclick="goBack()"
              class="btn btn-link text-decoration-none text-muted p-0 small fw-medium"
            >
              <i class="bi bi-chevron-left"></i> Dashboard
            </button>
          </div>

          <div class="card upload-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-5">
                <div
                  class="bg-primary bg-opacity-10 text-primary d-inline-block p-4 rounded-circle mb-3 animate__animated animate__bounceIn"
                >
                  <i class="bi bi-rocket-takeoff fs-1"></i>
                </div>
                <h2 class="fw-bold h3">Share Resource</h2>
                <p class="text-muted px-lg-5">
                  Empower your peers by contributing study materials to the hub.
                </p>
              </div>

              <form id="resourceForm">
                <div class="row g-4">
                  <div class="col-12">
                    <label
                      class="form-label fw-bold small text-uppercase text-muted"
                      >Resource Title</label
                    >
                    <input
                      type="text"
                      name="title"
                      class="form-control"
                      placeholder="e.g. 2024 Networking Fundamentals Slide"
                      required
                    />
                  </div>

                  <div class="col-12">
                    <label
                      class="form-label fw-bold small text-uppercase text-muted"
                      >Description</label
                    >
                    <textarea
                      name="description"
                      class="form-control"
                      rows="2"
                      placeholder="Tell us a bit about this..."
                    ></textarea>
                  </div>

                  <div class="col-md-6">
                    <label
                      class="form-label fw-bold small text-uppercase text-muted"
                      >Category</label
                    >
                    <select
                      name="category_id"
                      id="catDropdown"
                      class="form-select"
                      required
                    >
                      <option value="" disabled selected>
                        Select category...
                      </option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label
                      class="form-label fw-bold small text-uppercase text-muted"
                      >Format</label
                    >
                    <select id="sourceType" class="form-select">
                      <option value="file">📁 Document (PDF/PPT)</option>
                      <option value="youtube">🎥 YouTube Video</option>
                      <option value="link">🔗 External Link</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <div id="fileGroup" class="drop-zone p-5 text-center">
                      <i
                        class="bi bi-cloud-arrow-up-fill fs-1 text-primary mb-3"
                      ></i>
                      <h6 class="fw-bold mb-1">Click to upload file</h6>
                      <p class="small text-muted mb-3">
                        PDF, PPT, or ZIP (Max 25MB)
                      </p>
                      <input
                        type="file"
                        name="file"
                        id="fileInput"
                        accept=".pdf,.ppt,.pptx,.zip,.doc,.docx"
                        class="position-absolute opacity-0 w-100 h-100 top-0 start-0"
                        style="cursor: pointer"
                      />
                      <div
                        id="fileNameDisplay"
                        class="fw-bold text-success d-none"
                      ></div>
                    </div>

                    <div
                      id="linkGroup"
                      class="d-none animate__animated animate__fadeIn"
                    >
                      <label
                        class="form-label fw-bold small text-uppercase text-muted"
                        id="linkLabel"
                        >Resource URL</label
                      >
                      <div class="input-group">
                        <span class="input-group-text bg-white"
                          ><i class="bi bi-link-45deg"></i
                        ></span>
                        <input
                          type="url"
                          name="url"
                          id="urlInput"
                          class="form-control"
                          placeholder="https://..."
                        />
                      </div>
                      <small
                        class="text-primary mt-2 d-block"
                        id="linkHint"
                      ></small>
                    </div>
                  </div>

                  <div class="col-12 d-none" id="adminOptions">
                    <div
                      class="p-3 bg-primary bg-opacity-10 border border-primary border-opacity-10 rounded-4"
                    >
                      <div class="form-check form-switch">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          name="is_global"
                          id="isGlobal"
                        />
                        <label
                          class="form-check-label fw-bold small text-primary"
                          for="isGlobal"
                        >
                          MARK AS GLOBAL RESOURCE
                        </label>
                      </div>
                      <small class="text-muted d-block mt-1"
                        >Global items appear in all student libraries regardless
                        of institution.</small
                      >
                    </div>
                  </div>

                  <div class="col-12 mt-5">
                    <button
                      type="submit"
                      class="btn btn-primary w-100 btn-publish py-3"
                    >
                      <span id="btnText">PUBLISH RESOURCE</span>
                      <div
                        id="btnLoader"
                        class="spinner-border spinner-border-sm d-none"
                      ></div>
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <p class="text-center mt-4 text-muted small">
            Need help? Contact the
            <a
              href="mailto:evansbuckman1@gmail.com"
              class="text-primary fw-bold"
              >IT Support Team</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="./api.js"></script>
    <script src="./upload-resource.js"></script>
  </body>
</html>
