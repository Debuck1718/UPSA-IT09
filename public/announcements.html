<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements • Campus Hub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      :root {
        --accent: #4361ee;
      }
      body {
        background: #f0f2f5;
        font-family: "Inter", sans-serif;
      }

      .glass-nav {
        background: rgba(33, 37, 41, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .announcement-card {
        border: none;
        border-radius: 18px;
        background: #fff;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .announcement-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      }

      /* Indicator line for Global vs Program */
      .status-strip {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
      }
      .bg-global {
        background: #ffc107;
      } /* Gold */
      .bg-local {
        background: var(--accent);
      } /* Blue */

      .author-info {
        font-size: 0.85rem;
        color: #6c757d;
      }
      .empty-state {
        padding: 4rem 1rem;
        text-align: center;
      }

      @media (max-width: 768px) {
        .announcement-card {
          border-radius: 12px;
        }
        .container {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
      .text-accent {
        color: var(--accent);
      }

      .pulse-badge {
        animation: pulse-red 2s infinite;
        font-size: 0.65rem;
        padding: 4px 8px;
      }

      @keyframes pulse-red {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .announcement-card {
        border-left: 1px solid #eee !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark glass-nav mb-4 py-3">
      <div class="container">
        <button
          onclick="goBack()"
          class="btn btn-link text-white text-decoration-none p-0"
        >
          <i class="bi bi-chevron-left"></i>
        </button>
        <span class="navbar-brand fw-bold mx-auto">Campus Broadcast</span>
        <div id="adminAction"></div>
      </div>
    </nav>

    <div class="container pb-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="fw-bold mb-0">Latest Updates</h5>
            <div
              id="countBadge"
              class="badge rounded-pill bg-dark bg-opacity-10 text-dark"
            >
              0 Updates
            </div>
          </div>

          <div id="announcementsList" class="row g-3"></div>
        </div>
      </div>
    </div>

    <script src="./api.js"></script>
    <script src="./announcements.js"></script>
  </body>
</html>
