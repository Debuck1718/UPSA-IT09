<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements • Acadex</title>
    
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --accent: #0d6efd; /* Acadex Blue */
        --global-gold: #ffc107;
      }
      body {
        background: #f0f2f5;
        font-family: "Inter", sans-serif;
      }

      /* Navbar Branding */
      .glass-nav {
        background: rgba(33, 37, 41, 0.95);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        margin-right: 10px;
      }

      /* Card Styling */
      .announcement-card {
        border: none;
        border-radius: 18px;
        background: #fff;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        border-left: 1px solid #eee !important;
      }
      .announcement-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      }

      /* Status Strips */
      .status-strip {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
      }
      .bg-global { background: var(--global-gold); }
      .bg-local { background: var(--accent); }

      .author-info {
        font-size: 0.85rem;
        color: #6c757d;
        font-weight: 500;
      }

      /* Animation for importance */
      .pulse-badge {
        animation: pulse-opacity 2s infinite;
        font-size: 0.65rem;
        padding: 4px 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      @keyframes pulse-opacity {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
      }

      .btn-link-white {
        color: white;
        transition: 0.2s opacity;
      }
      .btn-link-white:hover {
        opacity: 0.7;
      }

      @media (max-width: 768px) {
        .announcement-card { border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark glass-nav mb-4 py-3">
      <div class="container">
        <button onclick="window.history.back()" class="btn btn-link-white text-decoration-none p-0">
          <i class="bi bi-chevron-left fs-5"></i>
        </button>
        
        <span class="navbar-brand fw-bold mx-auto d-flex align-items-center">
            <img src="/images/icon-192.png" alt="Logo" class="brand-logo bg-white">
            Acadex Broadcast
        </span>

        <div id="adminAction"></div>
      </div>
    </nav>

    <div class="container pb-5 animate__animated animate__fadeIn">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="fw-bold mb-0 text-dark">Latest Updates</h5>
            <div id="countBadge" class="badge rounded-pill bg-white shadow-sm text-dark px-3 py-2 border">
              0 Updates
            </div>
          </div>

          <div id="announcementsList" class="row g-3">
              <div class="text-center py-5">
                  <div class="spinner-border text-primary opacity-25" role="status"></div>
              </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./api.js"></script>
    <script src="./announcements.js"></script>
    <script>
        // Simple back function fallback
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/index.html';
            }
        }
    </script>
  </body>
</html>
