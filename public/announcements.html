<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements • Campus Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .announcement-card { border: none; border-left: 5px solid #0d6efd; border-radius: 8px; transition: 0.3s; }
        .announcement-card.global { border-left-color: #ffc107; } /* Gold for Global */
        .announcement-card:hover { transform: scale(1.01); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .author-badge { background: #e7f0ff; color: #0d6efd; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard-modern.html"><i class="bi bi-megaphone-fill me-2"></i>Campus Broadcast</a>
            <div id="actionArea"></div> </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Recent Updates</h4>
                    <div class="dropdown">
                        <button class="btn btn-white btn-sm border dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            Filter by Scope
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="filterAnnouncements('all')">All</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterAnnouncements('global')">Global Only</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterAnnouncements('program')">My Program</a></li>
                        </ul>
                    </div>
                </div>

                <div id="announcementsList">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./api.js"></script>
    <script src="./announcements.js"></script>
</body>
</html>
