<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Rep • Upload Slides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="./index.html">
          <span class="me-2">📚</span> Course Rep
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navMain" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="./courses.html">Browse Courses</a></li>
            <li class="nav-item"><a class="btn btn-light btn-sm" href="./admin.html">Admin</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-3">
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">Upload slides</div>
            <div class="card-body">
              <div id="alert" class="alert d-none" role="alert"></div>
              <form id="repUploadForm" class="row gy-3 gx-2 align-items-end" enctype="multipart/form-data">
                <div class="col-12">
                  <label for="repProgram" class="form-label">Program (optional)</label>
                  <input type="text" id="repProgram" name="program" class="form-control" placeholder="e.g., Information Technology">
                </div>
                <div class="col-12">
                  <label for="repClassGroup" class="form-label">Class/Group</label>
                  <input type="text" id="repClassGroup" name="classGroup" class="form-control" placeholder="e.g., IT1, IT2" required>
                  <div class="form-text">Students in this class/group will see these slides.</div>
                </div>
                <div class="col-12">
                  <label for="repCourseTitle" class="form-label">Course Title</label>
                  <div class="input-group">
                    <select id="repCourseTitle" name="courseTitle" class="form-select" required></select>
                    <button class="btn btn-outline-secondary" type="button" id="repAddTitleBtn">Add new</button>
                  </div>
                  <input type="text" id="repNewTitle" class="form-control mt-2 d-none" placeholder="New course title (e.g., Environmental Studies)">
                  <div class="form-text">Select a course title you’ve used before or add a new one.</div>
                </div>
                <div class="col-12">
                  <label for="repSlideTitle" class="form-label">Slide Title</label>
                  <input type="text" id="repSlideTitle" name="slideTitle" class="form-control" placeholder="e.g., Week 1 - Introduction" required>
                </div>
                <div class="col-12">
                  <label for="repFile" class="form-label">Slide file</label>
                  <input type="file" id="repFile" name="file" class="form-control" accept=".pdf,.ppt,.pptx" required>
                  <div class="form-text">Accepted: PDF, PPT, PPTX</div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">Upload slide</button>
                </div>
              </form>

              <hr class="my-4">

              <div>
                <h6 class="fw-semibold mb-2">Manage semester courses (titles)</h6>
                <form id="repManageCourses" class="row gy-2 gx-2">
                  <div class="col-12 col-md-8">
                    <input type="text" id="repManageTitle" class="form-control" placeholder="Add course title (e.g., Environmental Studies)">
                  </div>
                  <div class="col-12 col-md-4">
                    <button class="btn btn-outline-primary w-100" type="submit">Add title</button>
                  </div>
                </form>
                <div id="repTitlesCards" class="row g-2 mt-2"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card shadow-sm mb-3">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <span class="fw-semibold">Courses</span>
              <button id="refreshCourses" class="btn btn-sm btn-outline-primary">Refresh</button>
            </div>
            <div class="card-body p-0">
              <ul id="repCoursesList" class="list-group list-group-flush"></ul>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <span id="repCourseTitle" class="fw-semibold">Select a course to see recent slides</span>
            </div>
            <div class="card-body">
              <div id="repSlidesEmpty" class="text-muted">No course selected.</div>
              <ul id="repSlidesList" class="list-group d-none"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./rep.js"></script>
  </body>
</html>
