<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signup - Course Slides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow">
            <div class="card-header text-center bg-primary text-white">
              <div class="fw-semibold">Create your account</div>
              <small class="text-white-50">Access course slides and updates</small>
            </div>
            <div class="card-body p-4">
              <div id="alert" class="alert alert-danger d-none" role="alert"></div>

              <form id="signupForm" novalidate>
                <div class="mb-3">
                  <label for="studentId" class="form-label">Student ID</label>
                  <input type="text" class="form-control" id="studentId" name="studentId" autocomplete="username" required>
                  <div class="form-text">Use your official UPSA student ID (e.g., S123456).</div>
                </div>

                <div class="mb-3">
                  <label for="full_name" class="form-label">Full name</label>
                  <input type="text" class="form-control" id="full_name" name="full_name" autocomplete="name" required>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" autocomplete="email" inputmode="email" required>
                  <div class="form-text">We’ll send important updates to this address.</div>
                </div>

                <div class="mb-3">
                  <label for="course" class="form-label">Course</label>
                  <input type="text" class="form-control" id="course" name="course" autocomplete="organization-title" required>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="6" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">Show</button>
                  </div>
                  <div class="form-text">Use at least 6 characters with a mix of letters and numbers.</div>
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Confirm password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirm" aria-label="Show password">Show</button>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Create account</button>
              </form>
            </div>
          </div>
          <div class="mt-3 text-center small">
            Already have an account? <a href="./index.html">Log in</a>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function(){
        const toggle = (btnId, inputId) => {
          const btn = document.getElementById(btnId);
          const input = document.getElementById(inputId);
          if (!btn || !input) return;
          btn.addEventListener('click', () => {
            const isPw = input.type === 'password';
            input.type = isPw ? 'text' : 'password';
            btn.textContent = isPw ? 'Hide' : 'Show';
            btn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
          });
        };
        toggle('togglePassword', 'password');
        toggle('toggleConfirm', 'confirmPassword');
      })();
    </script>
    <script src="./signup.js"></script>
  </body>
</html>
