<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses • Slides</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="./index.html">
          <span class="me-2">🎓</span> Course Slides
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navMain" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a href="/rep-dashboard" class="btn btn-light btn-sm px-3">Back to Dashboard</a>
            </li>
          </ul>        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
        <div>
          <h1 class="h4 mb-1">Browse slides by course</h1>
          <p class="text-muted mb-0">Select a course to view available slide files.</p>
        </div>
      </div>

      <div class="alert alert-info mb-3" role="alert">
        You are viewing slides scoped to your class group and cohort. Select a course to filter.
      </div>
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">Courses</div>
            <div class="card-body p-0">
              <ul id="coursesList" class="list-group list-group-flush"></ul>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <span id="courseTitle" class="fw-semibold">Select a course</span>
            </div>
            <div class="card-body">
              <div id="slidesEmpty" class="text-muted">No course selected.</div>
              <ul id="slidesList" class="list-group d-none"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./api.js"></script>
    <script src="./courses.js"></script>
  </body>
</html>
