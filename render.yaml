services:
  - type: web
    name: upsa-course-slides
    runtime: node
    plan: free
    region: oregon
    buildCommand: |
      npm ci
      npm rebuild sqlite3 --build-from-source || true
    startCommand: node app.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: KEEPALIVE
        value: "true"
      - key: KEEPALIVE_INTERVAL_MS
        value: "60000"
    healthCheckPath: /healthz
    disks:
      - name: uploads
        mountPath: /opt/render/project/src/uploads
        sizeGB: 1
      - name: data
        mountPath: /opt/render/project/src/data
        sizeGB: 1