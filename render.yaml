services:
  - type: web
    name: upsa-course-slides
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node app.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: KEEPALIVE
        value: "true"
      - key: KEEPALIVE_INTERVAL_MS
        value: "60000"
    healthCheckPath: /healthz