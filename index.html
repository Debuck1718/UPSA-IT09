<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="refresh" content="0; url=./public/index.html">
    <meta charset="utf-8">
    <title>Redirecting…</title>
  </head>
  <body>
    <p>If you are not redirected automatically, <a href="./public/index.html">click here</a>.</p>

      // JS redirect fallback for environments that ignore meta refresh
      location.replace('./public/index.html');
    </script>
  </body>
</html>
